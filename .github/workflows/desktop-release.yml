name: Desktop build artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix apps/desktop
      - run: npm test --prefix apps/desktop
      - if: runner.os == 'Windows'
        run: npm run build:win --prefix apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: runner.os == 'macOS'
        run: npm run build:mac --prefix apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: gods-eye-view-${{ runner.os }}-unsigned
          path: |
            output/desktop/*.exe
            output/desktop/*.dmg
          if-no-files-found: error
