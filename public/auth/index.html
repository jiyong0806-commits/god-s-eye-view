<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GOD'S EYE VIEW - Access Terminal</title>
  <meta name="theme-color" content="#020712">
  <link rel="icon" type="image/png" href="/app-icon.png">
  <style>
    @font-face {
      font-family: Pretendard;
      src: url('/fonts/PretendardVariable.woff2') format('woff2-variations');
      font-weight: 45 920;
      font-display: swap;
    }
    :root {
      color-scheme: dark;
      --cyan: #00f0ff;
      --glass: rgba(8, 12, 21, 0.46);
      --line: rgba(255, 255, 255, 0.08);
      --text: #f2fbff;
      --muted: rgba(242, 251, 255, 0.58);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      color: var(--text);
      background: #01030a;
    }
    .bg, .bg video, .bg .blend, .veil { position: fixed; inset: 0; }
    .bg .blend { background: center / cover no-repeat url('/media/untitled-blend.svg'); opacity: 0.18; filter: hue-rotate(118deg) saturate(0.8) brightness(0.48); }
    .bg video { width: 100%; height: 100%; object-fit: cover; opacity: 0.44; filter: saturate(1.15) contrast(1.08); }
    .veil {
      background: rgba(1, 3, 10, 0.72);
    }
    .scan {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(255,255,255,0.025), rgba(255,255,255,0.025) 1px, transparent 1px, transparent 5px);
      mix-blend-mode: screen;
      opacity: 0.42;
    }
    .shell {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      padding: clamp(1rem, 3vw, 2rem);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      font: 700 0.78rem/1.2 Pretendard, sans-serif;
      letter-spacing: 0;
      color: rgba(222, 249, 255, 0.78);
    }
    .brand { display: inline-flex; align-items: center; gap: 0.75rem; }
    .brand img { width: 2rem; height: 2rem; }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 430px);
      align-items: center;
      gap: clamp(2rem, 6vw, 6rem);
      max-width: 1220px;
      width: 100%;
      margin: 0 auto;
    }
    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(3rem, 8vw, 7.6rem);
      line-height: 0.92;
      letter-spacing: 0;
    }
    .eyebrow {
      margin: 0 0 1rem;
      color: var(--cyan);
      font: 800 0.78rem/1.2 Pretendard, sans-serif;
      letter-spacing: 0;
    }
    .copy {
      max-width: 620px;
      margin: 1.4rem 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.8vw, 1.25rem);
      line-height: 1.68;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 1.2rem;
      background: var(--glass);
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.05), 0 28px 90px rgba(0,0,0,0.58);
      backdrop-filter: blur(32px) saturate(190%);
    }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 1rem; }
    .tabs button, .submit {
      border: 1px solid var(--line);
      border-radius: 6px;
      min-height: 3rem;
      color: var(--text);
      background: rgba(255,255,255,0.035);
      font-weight: 800;
    }
    .tabs button.active, .submit {
      color: #041018;
      background: linear-gradient(135deg, #96fff7, #00f0ff);
      border-color: rgba(0, 240, 255, 0.7);
    }
    form { display: grid; gap: 0.85rem; }
    label { display: grid; gap: 0.35rem; color: var(--muted); font-size: 0.82rem; }
    input {
      width: 100%;
      min-height: 3.05rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 0.9rem;
      color: var(--text);
      background: rgba(2, 8, 18, 0.58);
      outline: none;
    }
    input:focus { border-color: rgba(0, 240, 255, 0.72); }
    .hidden { display: none; }
    .status { min-height: 1.3rem; color: var(--cyan); font-size: 0.84rem; }
    .back { color: var(--muted); text-decoration: none; }
    @media (max-width: 820px) {
      body { overflow: auto; }
      main { grid-template-columns: 1fr; padding: 4rem 0; }
      header { letter-spacing: 0.16em; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="blend"></div>
    <video autoplay muted loop playsinline src="/media/animo-spread-rows-720p.webm"></video>
    <div class="veil"></div>
    <div class="scan"></div>
  </div>
  <div class="shell">
    <header>
      <div class="brand"><img src="/logo.svg" alt="">GOD'S EYE VIEW</div>
      <a class="back" href="/">인증 없이 지도 미리보기</a>
    </header>
    <main>
      <section>
        <p class="eyebrow">PLASMA 보안 접속 터미널</p>
        <h1>한 번의 로그인.<br>지구의 모든 신호.</h1>
        <p class="copy">실시간 3D 지도, 항공·해양·재난 레이어와 Plasma 음성 관제를 하나의 운영자 화면에서 확인하세요.</p>
      </section>
      <section class="card" aria-label="로그인과 회원가입">
        <div class="tabs">
          <button id="signin-tab" class="active" type="button">로그인</button>
          <button id="register-tab" type="button">회원가입</button>
        </div>
        <form id="signin-form">
          <label>이메일<input name="email" type="email" autocomplete="username" required></label>
          <label>비밀번호<input name="password" type="password" autocomplete="current-password" minlength="8" required></label>
          <button class="submit" type="submit">시스템 접속</button>
        </form>
        <form id="register-form" class="hidden">
          <label>이름<input name="name" autocomplete="name" required></label>
          <label>이메일<input name="email" type="email" autocomplete="email" required></label>
          <label>비밀번호<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
          <label>비밀번호 확인<input name="passwordConfirm" type="password" autocomplete="new-password" minlength="8" required></label>
          <label><span><input name="marketing" type="checkbox"> 제품 업데이트 이메일 수신 동의(선택)</span></label>
          <button class="submit" type="submit">운영자 계정 만들기</button>
        </form>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>
  <script type="module">
    let supabase = null;
    try {
      const configResponse = await fetch('/auth-config.json', { cache: 'no-store' });
      if (configResponse.ok) {
        const config = await configResponse.json();
        if (config.supabaseUrl && config.supabasePublishableKey) {
          const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
          supabase = createClient(config.supabaseUrl, config.supabasePublishableKey);
        }
      }
    } catch (error) {
      console.info('[Auth] Supabase 공개 설정이 아직 연결되지 않았습니다.', error?.message || error);
    }
    const signinTab = document.querySelector('#signin-tab');
    const registerTab = document.querySelector('#register-tab');
    const signinForm = document.querySelector('#signin-form');
    const registerForm = document.querySelector('#register-form');
    const status = document.querySelector('#status');
    function setMode(mode) {
      const register = mode === 'register';
      signinTab.classList.toggle('active', !register);
      registerTab.classList.toggle('active', register);
      signinForm.classList.toggle('hidden', register);
      registerForm.classList.toggle('hidden', !register);
      status.textContent = '';
    }
    signinTab.addEventListener('click', () => setMode('signin'));
    registerTab.addEventListener('click', () => setMode('register'));
    for (const form of [signinForm, registerForm]) {
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const type = form.id.includes('register') ? 'register' : 'signin';
        const values = Object.fromEntries(new FormData(form));
        if (type === 'register' && values.password !== values.passwordConfirm) {
          status.textContent = '비밀번호가 서로 일치하지 않습니다.';
          return;
        }
        if (!supabase) {
          status.textContent = '인증 서버 설정이 아직 연결되지 않았습니다.';
          return;
        }
        status.textContent = type === 'register' ? '계정을 만드는 중…' : '보안 세션을 여는 중…';
        const request = type === 'register'
          ? supabase.auth.signUp({ email: values.email, password: values.password, options: { data: { display_name: values.name, marketing_opt_in: values.marketing === 'on' } } })
          : supabase.auth.signInWithPassword({ email: values.email, password: values.password });
        const { data, error } = await request;
        if (error) {
          status.textContent = error.message;
          return;
        }
        if (type === 'register' && !data.session) {
          status.textContent = '확인 메일을 보냈습니다. 이메일 인증 후 로그인하세요.';
          return;
        }
        window.location.assign('/');
      });
    }
  </script>
</body>
</html>
